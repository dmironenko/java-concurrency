name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: build
        run: ./gradlew build --no-daemon
